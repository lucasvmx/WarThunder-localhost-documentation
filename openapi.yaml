openapi: 3.0.3
info:
  title: War Thunder Localhost API
  description: >-
    OpenAPI specification for the local API exposed by War Thunder for
    telemetry, aircraft state, chat, mission, and map data.
  version: 1.0.0
  license:
    name: GNU General Public License v3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: http://localhost:8111
    description: Local War Thunder server
tags:
  - name: Chat
    description: In-game chat messages and HUD events.
  - name: Aircraft
    description: Aircraft instruments and current state.
  - name: Map
    description: Current map metadata, objects, and image.
  - name: Mission
    description: Current mission objectives and status.
paths:
  /gamechat:
    get:
      tags: [Chat]
      summary: List chat messages
      description: >-
        Returns messages available after the specified identifier. Use `lastId`
        for incremental polling and to avoid processing messages more than once.
      operationId: getGameChat
      parameters:
        - $ref: '#/components/parameters/LastId'
      responses:
        '200':
          description: List of chat messages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
              example:
                - id: 70
                  msg: hahaha
                  sender: pecusgaming
                  enemy: false
                  mode: All
                - id: 71
                  msg: this thing is slightly op tbh
                  sender: pecusgaming
                  enemy: false
                  mode: All

  /hudmsg:
    get:
      tags: [Chat]
      summary: List HUD events and damage messages
      description: >-
        Returns events and damage messages after the specified identifiers. The
        client must keep these identifiers to perform incremental polling.
      operationId: getHudMessages
      parameters:
        - $ref: '#/components/parameters/LastEvent'
        - $ref: '#/components/parameters/LastDamage'
      responses:
        '200':
          description: HUD events and damage messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HudMessages'
              example:
                events: []
                damage:
                  - id: 161
                    msg: percusiones1r (Spitfire) set afire *shino_rs (Spitfire)
                    sender: ''
                    enemy: false
                    mode: ''
                  - id: 162
                    msg: '*shino_rs (Spitfire) has crashed.'
                    sender: ''
                    enemy: false
                    mode: ''

  /indicators:
    get:
      tags: [Aircraft]
      summary: Get aircraft instruments
      description: >-
        Returns the values displayed by the current aircraft's instruments. The
        number of engines and some fields may vary by vehicle.
      operationId: getAircraftIndicators
      responses:
        '200':
          description: Current aircraft instrument state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AircraftIndicators'
              example:
                valid: true
                type: so_4050_vautour_2a_iaf
                speed: 0
                altitude_hour: 63.055698
                compass: 355.831299
                fuel: 3182
                throttle: 0
                mach: 0

  /state:
    get:
      tags: [Aircraft]
      summary: Get the current aircraft state
      description: >-
        Returns flight telemetry and engine parameters. Property names follow
        the format provided by the game, including units in the name and the
        engine index.
      operationId: getAircraftState
      responses:
        '200':
          description: Current aircraft state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AircraftState'
              example:
                valid: true
                H, m: 4936
                TAS, km/h: 237
                IAS, km/h: 185
                M: 0.2
                AoA, deg: 1.1
                Vy, m/s: 3.2
                Mfuel, kg: 750
                'throttle 1, %': 100

  /map_info.json:
    get:
      tags: [Map]
      summary: Get map metadata
      description: >-
        Returns the boundaries, grid origin, and step sizes for the current map.
        The current examples return numbers as strings.
      operationId: getMapInfo
      responses:
        '200':
          description: Current map metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapInfo'
              example:
                grid_steps: ['3250.0', '3250.0']
                grid_zero: ['-32768.0', '32768.0']
                map_generation: '1'
                map_max: ['32768.0', '32768.0']
                map_min: ['-32768.0', '-32768.0']

  /map_obj.json:
    get:
      tags: [Map]
      summary: List map objects
      description: >-
        Returns objects visible on the current map. Fields such as `sx`, `sy`,
        `ex`, `ey`, `dx`, and `dy` only appear for certain object types.
      operationId: getMapObjects
      responses:
        '200':
          description: Current map objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MapObject'
              example:
                - type: aircraft
                  color: '#185AFF'
                  color[]: [24, 90, 255]
                  blink: 0
                  icon: Assault
                  icon_bg: none
                  x: 0.535131
                  y: 0.489011
                  dx: -0.888831
                  dy: -0.458235

  /mission.json:
    get:
      tags: [Mission]
      summary: Get the current mission
      description: Returns the objectives and status of the current mission.
      operationId: getMission
      responses:
        '200':
          description: Current mission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
              example:
                objectives:
                  - primary: true
                    status: in_progress
                    text: Decole
                status: running

  /map.img:
    get:
      tags: [Map]
      summary: Get the map image
      description: Returns the binary resource for the current map image.
      operationId: getMapImage
      responses:
        '200':
          description: Binary map image.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

components:
  parameters:
    LastId:
      name: lastId
      in: query
      description: ID of the last message processed by the client.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    LastEvent:
      name: lastEvt
      in: query
      description: ID of the last event processed by the client.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    LastDamage:
      name: lastDmg
      in: query
      description: ID of the last damage message processed by the client.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0

  schemas:
    ChatMessage:
      type: object
      description: Message published in the in-game chat.
      required: [id, msg, sender, enemy, mode]
      properties:
        id:
          type: integer
          format: int64
          description: Incremental message ID.
          example: 70
        msg:
          type: string
          description: Message content.
          example: hahaha
        sender:
          type: string
          description: Name of the player who sent the message.
          example: pecusgaming
        enemy:
          type: boolean
          description: Whether the sender belongs to the enemy team.
          example: false
        mode:
          type: string
          description: Chat channel or mode.
          example: All

    HudMessages:
      type: object
      description: Collection of HUD events and damage messages.
      required: [events, damage]
      properties:
        events:
          type: array
          description: HUD events. The format may vary by game version.
          items:
            type: object
            additionalProperties: true
        damage:
          type: array
          description: Damage and destruction messages.
          items:
            $ref: '#/components/schemas/HudDamage'

    HudDamage:
      type: object
      description: Damage message published by the HUD.
      required: [id, msg, sender, enemy, mode]
      properties:
        id:
          type: integer
          format: int64
          example: 161
        msg:
          type: string
          example: percusiones1r (Spitfire) set afire *shino_rs (Spitfire)
        sender:
          type: string
          example: ''
        enemy:
          type: boolean
          example: false
        mode:
          type: string
          example: ''

    AircraftIndicators:
      type: object
      description: >-
        Aircraft instruments. Numeric values are normally decimals; additional
        fields may be emitted for aircraft with different configurations.
      required: [valid, type]
      additionalProperties: true
      properties:
        valid:
          type: boolean
          description: Whether the instrument data is valid.
          example: true
        type:
          type: string
          description: Aircraft identifier.
          example: so_4050_vautour_2a_iaf
        speed: { $ref: '#/components/schemas/TelemetryNumber' }
        pedals: { $ref: '#/components/schemas/TelemetryNumber' }
        pedals1: { $ref: '#/components/schemas/TelemetryNumber' }
        pedals2: { $ref: '#/components/schemas/TelemetryNumber' }
        pedals3: { $ref: '#/components/schemas/TelemetryNumber' }
        stick_elevator: { $ref: '#/components/schemas/TelemetryNumber' }
        stick_elevator1: { $ref: '#/components/schemas/TelemetryNumber' }
        stick_ailerons: { $ref: '#/components/schemas/TelemetryNumber' }
        vario: { $ref: '#/components/schemas/TelemetryNumber' }
        altitude_hour: { $ref: '#/components/schemas/TelemetryNumber' }
        altitude_min: { $ref: '#/components/schemas/TelemetryNumber' }
        altitude_10k: { $ref: '#/components/schemas/TelemetryNumber' }
        aviahorizon_roll: { $ref: '#/components/schemas/TelemetryNumber' }
        aviahorizon_pitch: { $ref: '#/components/schemas/TelemetryNumber' }
        bank: { $ref: '#/components/schemas/TelemetryNumber' }
        turn: { $ref: '#/components/schemas/TelemetryNumber' }
        compass: { $ref: '#/components/schemas/TelemetryNumber' }
        compass1: { $ref: '#/components/schemas/TelemetryNumber' }
        compass2: { $ref: '#/components/schemas/TelemetryNumber' }
        clock_hour: { $ref: '#/components/schemas/TelemetryNumber' }
        clock_min: { $ref: '#/components/schemas/TelemetryNumber' }
        clock_sec: { $ref: '#/components/schemas/TelemetryNumber' }
        rpm_min: { $ref: '#/components/schemas/TelemetryNumber' }
        rpm1_min: { $ref: '#/components/schemas/TelemetryNumber' }
        rpm_hour: { $ref: '#/components/schemas/TelemetryNumber' }
        rpm1_hour: { $ref: '#/components/schemas/TelemetryNumber' }
        oil_pressure: { $ref: '#/components/schemas/TelemetryNumber' }
        oil_pressure1: { $ref: '#/components/schemas/TelemetryNumber' }
        head_temperature: { $ref: '#/components/schemas/TelemetryNumber' }
        head_temperature1: { $ref: '#/components/schemas/TelemetryNumber' }
        fuel: { $ref: '#/components/schemas/TelemetryNumber' }
        fuel1: { $ref: '#/components/schemas/TelemetryNumber' }
        fuel_pressure: { $ref: '#/components/schemas/TelemetryNumber' }
        fuel_pressure1: { $ref: '#/components/schemas/TelemetryNumber' }
        airbrake_lever: { $ref: '#/components/schemas/TelemetryNumber' }
        airbrake_indicator: { $ref: '#/components/schemas/TelemetryNumber' }
        gears: { $ref: '#/components/schemas/TelemetryNumber' }
        gears1: { $ref: '#/components/schemas/TelemetryNumber' }
        gears_lamp: { $ref: '#/components/schemas/TelemetryNumber' }
        flaps: { $ref: '#/components/schemas/TelemetryNumber' }
        flaps1: { $ref: '#/components/schemas/TelemetryNumber' }
        throttle: { $ref: '#/components/schemas/TelemetryNumber' }
        throttle1: { $ref: '#/components/schemas/TelemetryNumber' }
        weapon2: { $ref: '#/components/schemas/TelemetryNumber' }
        weapon3: { $ref: '#/components/schemas/TelemetryNumber' }
        mach: { $ref: '#/components/schemas/TelemetryNumber' }
        g_meter: { $ref: '#/components/schemas/TelemetryNumber' }
        g_meter_min: { $ref: '#/components/schemas/TelemetryNumber' }
        g_meter_max: { $ref: '#/components/schemas/TelemetryNumber' }
        blister1: { $ref: '#/components/schemas/TelemetryNumber' }
        blister2: { $ref: '#/components/schemas/TelemetryNumber' }
        blister3: { $ref: '#/components/schemas/TelemetryNumber' }
        blister4: { $ref: '#/components/schemas/TelemetryNumber' }
        blister5: { $ref: '#/components/schemas/TelemetryNumber' }
        blister6: { $ref: '#/components/schemas/TelemetryNumber' }
        blister7: { $ref: '#/components/schemas/TelemetryNumber' }
        wing_sweep_lever:
          type: string
          description: Sweep angle of the variable-sweep wing, when available.

    AircraftState:
      type: object
      description: >-
        Flight state and engine parameters. The set of properties depends on
        the aircraft; keys with `N` represent the engine number.
      required: [valid]
      additionalProperties: true
      properties:
        valid:
          type: boolean
          description: Whether the returned state is valid.
          example: true
        'aileron, %': { $ref: '#/components/schemas/TelemetryNumber' }
        'elevator, %': { $ref: '#/components/schemas/TelemetryNumber' }
        'rudder, %': { $ref: '#/components/schemas/TelemetryNumber' }
        'flaps, %': { $ref: '#/components/schemas/TelemetryNumber' }
        'H, m': { $ref: '#/components/schemas/TelemetryNumber' }
        'TAS, km/h': { $ref: '#/components/schemas/TelemetryNumber' }
        'IAS, km/h': { $ref: '#/components/schemas/TelemetryNumber' }
        M: { $ref: '#/components/schemas/TelemetryNumber' }
        'AoA, deg': { $ref: '#/components/schemas/TelemetryNumber' }
        'AoS, deg': { $ref: '#/components/schemas/TelemetryNumber' }
        Ny: { $ref: '#/components/schemas/TelemetryNumber' }
        'Vy, m/s': { $ref: '#/components/schemas/TelemetryNumber' }
        'Wx, deg/s': { $ref: '#/components/schemas/TelemetryNumber' }
        'Mfuel, kg': { $ref: '#/components/schemas/TelemetryNumber' }
        'Mfuel0, kg': { $ref: '#/components/schemas/TelemetryNumber' }
        'throttle 1, %': { $ref: '#/components/schemas/TelemetryNumber' }
        'throttle 2, %': { $ref: '#/components/schemas/TelemetryNumber' }
        'throttle 3, %': { $ref: '#/components/schemas/TelemetryNumber' }
        'mixture 1, %': { $ref: '#/components/schemas/TelemetryNumber' }
        'mixture 2, %': { $ref: '#/components/schemas/TelemetryNumber' }
        'mixture 3, %': { $ref: '#/components/schemas/TelemetryNumber' }
        'magneto 1': { $ref: '#/components/schemas/TelemetryNumber' }
        'magneto 2': { $ref: '#/components/schemas/TelemetryNumber' }
        'magneto 3': { $ref: '#/components/schemas/TelemetryNumber' }
        'power 1, hp': { $ref: '#/components/schemas/TelemetryNumber' }
        'power 2, hp': { $ref: '#/components/schemas/TelemetryNumber' }
        'power 3, hp': { $ref: '#/components/schemas/TelemetryNumber' }
        'RPM 1': { $ref: '#/components/schemas/TelemetryNumber' }
        'RPM 2': { $ref: '#/components/schemas/TelemetryNumber' }
        'RPM 3': { $ref: '#/components/schemas/TelemetryNumber' }
        'manifold pressure 1, atm': { $ref: '#/components/schemas/TelemetryNumber' }
        'manifold pressure 2, atm': { $ref: '#/components/schemas/TelemetryNumber' }
        'manifold pressure 3, atm': { $ref: '#/components/schemas/TelemetryNumber' }
        'oil temp 1, C': { $ref: '#/components/schemas/TelemetryNumber' }
        'oil temp 2, C': { $ref: '#/components/schemas/TelemetryNumber' }
        'oil temp 3, C': { $ref: '#/components/schemas/TelemetryNumber' }
        'pitch 1, deg': { $ref: '#/components/schemas/TelemetryNumber' }
        'pitch 2, deg': { $ref: '#/components/schemas/TelemetryNumber' }
        'pitch 3, deg': { $ref: '#/components/schemas/TelemetryNumber' }
        'thrust 1, kgs': { $ref: '#/components/schemas/TelemetryNumber' }
        'thrust 2, kgs': { $ref: '#/components/schemas/TelemetryNumber' }
        'thrust 3, kgs': { $ref: '#/components/schemas/TelemetryNumber' }
        'efficiency 1, %': { $ref: '#/components/schemas/TelemetryNumber' }
        'efficiency 2, %': { $ref: '#/components/schemas/TelemetryNumber' }
        'efficiency 3, %': { $ref: '#/components/schemas/TelemetryNumber' }

    MapInfo:
      type: object
      description: Spatial metadata for the current map.
      required: [grid_steps, grid_zero, map_generation, map_max, map_min]
      properties:
        grid_steps:
          $ref: '#/components/schemas/NumericStringPair'
        grid_zero:
          $ref: '#/components/schemas/NumericStringPair'
        map_generation:
          type: string
          description: Map version or generation, represented as a numeric string.
          example: '1'
        map_max:
          $ref: '#/components/schemas/NumericStringPair'
        map_min:
          $ref: '#/components/schemas/NumericStringPair'

    MapObject:
      type: object
      description: Object represented on the map.
      additionalProperties: true
      properties:
        type:
          type: string
          description: Object type.
          enum: [aircraft, airfield, bombing_point, defending_point, ground_model, respawn_base_bomber, respawn_base_fighter]
          example: aircraft
        color:
          type: string
          description: Hexadecimal color associated with the object.
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#185AFF'
        'color[]':
          type: array
          description: RGB components of the color associated with the object.
          minItems: 3
          maxItems: 3
          items:
            type: integer
            minimum: 0
            maximum: 255
          example: [24, 90, 255]
        blink:
          type: integer
          description: Object blinking indicator.
          example: 0
        icon:
          type: string
          description: Name of the icon associated with the object.
          example: Assault
        icon_bg:
          type: string
          description: Name of the background icon associated with the object.
          example: none
        x:
          type: number
          format: double
          description: Normalized X position on the map.
          example: 0.535131
        y:
          type: number
          format: double
          description: Normalized Y position on the map.
          example: 0.489011
        sx:
          type: number
          format: double
          description: Initial X position of an area, used by airfields.
        sy:
          type: number
          format: double
          description: Initial Y position of an area, used by airfields.
        ex:
          type: number
          format: double
          description: Final X position of an area, used by airfields.
        ey:
          type: number
          format: double
          description: Final Y position of an area, used by airfields.
        dx:
          type: number
          format: double
          description: X component of the direction vector, used by aircraft.
        dy:
          type: number
          format: double
          description: Y component of the direction vector, used by aircraft.

    Mission:
      type: object
      description: Current mission and its objectives.
      required: [objectives, status]
      properties:
        objectives:
          type: array
          description: List of mission objectives.
          items:
            $ref: '#/components/schemas/MissionObjective'
        status:
          type: string
          description: Overall mission status. The commonly observed value is `running`.
          example: running

    MissionObjective:
      type: object
      description: Individual mission objective.
      required: [primary, status, text]
      properties:
        primary:
          type: boolean
          description: Whether this is a primary objective.
          example: true
        status:
          type: string
          description: Objective status.
          enum: [in_progress, completed, failed]
          example: in_progress
        text:
          type: string
          description: Instruction presented to the player.
          example: Decole

    NumericStringPair:
      type: array
      description: Pair of numeric values serialized as strings.
      minItems: 2
      maxItems: 2
      items:
        type: string
        pattern: '^-?[0-9]+(?:\.[0-9]+)?$'
      example: ['3250.0', '3250.0']

    TelemetryNumber:
      type: number
      format: double
      description: Numeric telemetry value.
